version: 2.1

commands:
  quay_io_login:
    steps:
      - run:
          name: Login to Quay.io register
          command: docker login quay.io -u "${QUAY_USER}" -p "${QUAY_TOKEN}"

  gitoo_install_odoo:
    steps:
      - run:
          name: Gitoo install odoo source code
          command: ./gitoo-install-odoo.sh
          no_output_timeout: 45m

  gitoo_install_extra_addons:
    steps:
      - run:
          name: Gitoo install extra addons
          command: ./gitoo-install-addons.sh
          no_output_timeout: 45m

  deploy_docker_build:
    steps:
      - run:
          name: Docker build
          command: docker build --build-arg GIT_TOKEN=${GIT_TOKEN}  --rm --pull -t "${DOCKER_IMAGE_NAME}" .
          no_output_timeout: 45m

  deploy_docker_push:
    steps:
      - run:
          name: Docker push
          command: docker push "${DOCKER_IMAGE_NAME}"

jobs:
  run-test:
    machine: true
    steps:
       - checkout
       - run:
          name: Setup Log Folder For Reports
          command: sudo mkdir -p ./log && sudo chmod 777 ./log
       - gitoo_install_odoo
       - gitoo_install_extra_addons
       - run:
          name: Build -- Init Database
          command: docker-compose run --rm odoo odoo --stop-after-init -i main
       - run:
          name: Run our tests
          command: sudo docker-compose run --rm -u root odoo /usr/local/bin/run_pytest.sh

  deploy:
    machine: true
    steps:
       - checkout
       - quay_io_login
       - gitoo_install_odoo
       - gitoo_install_extra_addons
       - run:
          name: Set DOCKER_IMAGE_NAME env variable to odoo-public
          command: |
            echo 'export DOCKER_IMAGE_NAME="quay.io/${CIRCLE_PROJECT_USERNAME,,}/${CIRCLE_PROJECT_REPONAME,,}:${CIRCLE_TAG}"' >> $BASH_ENV
            source $BASH_ENV
            echo docker image name: ${DOCKER_IMAGE_NAME}
       - deploy_docker_build
       - deploy_docker_push

  deploy-latest:
    machine: true
    steps:
      - checkout
      - quay_io_login
      - gitoo_install_odoo
      - gitoo_install_extra_addons
      - run:
          name: Set DOCKER_IMAGE_NAME env variable to odoo-public
          command: |
            echo 'export DOCKER_IMAGE_NAME="quay.io/${CIRCLE_PROJECT_USERNAME,,}/${CIRCLE_PROJECT_REPONAME,,}:${CIRCLE_BRANCH/\.0/\.latest}"' >> $BASH_ENV
            source $BASH_ENV
            echo docker image name: ${DOCKER_IMAGE_NAME}
      - deploy_docker_build
      - deploy_docker_push

  auto-tag:
    machine: true
    steps:
      - checkout
      - quay_io_login
      - run:
          name: Get nws
          command: |
            curl -L $NWS_BIN_LOCATION > ./nws
            chmod +x ./nws
      - run:
          name: Set tag
          command: |
            ./nws circleci create-tag

  spread-the-version:
    machine: true
    steps:
      - checkout
      - quay_io_login
      - run:
          name: Get nws
          command: |
            curl -L $NWS_BIN_LOCATION > ./nws
            chmod +x ./nws
      - run:
          name: Spread the version
          command: |
            ./nws circleci spread

workflows:
  build:
    jobs:
      - run-test:
          filters:
            tags:
              only: /.*/

      - auto-tag:
          context: nws
          requires:
            - run-test
          filters:
            branches:
              only: /^1\d\.0/

      - deploy:
          context: quay.io
          requires:
            - run-test
          filters:
            # Only tags because the env var CIRCLE_TAG is used to define the name of the image.
            tags:
              only: /.*/
            branches:
              ignore: /.*/

      - deploy-latest:
          context: quay.io
          requires:
            - run-test
          filters:
            branches:
              only: /^1\d\.0/

      - spread-the-version:
          context: nws
          requires:
            - deploy
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
